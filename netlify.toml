# Netlify configuration — AA Mafia Chronicle
# The site is a single self-contained HTML file; there is nothing to compile.

[build]
  # Nothing to build: index.html is already complete. Netlify just publishes this directory.
  publish = "."

# The report routes entirely in the URL hash (#/timeline, #/stakeholders/ivo …), so no SPA
# rewrite is strictly required. This rule only makes a hand-typed path such as /stakeholders
# serve the app instead of Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    # Everything the page needs is inline; the only external origin is Google Fonts.
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; form-action 'none'; frame-ancestors 'self'; base-uri 'none'"

# index.html carries the data, so it must not be served stale after a redeploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
